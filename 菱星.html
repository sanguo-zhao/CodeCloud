<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Hand Interaction System (Optimized)</title>
    <style>
        :root { --glass: rgba(10, 10, 10, 0.7); --highlight: #00ffff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* 3D 容器 */
        #canvas-container { position: absolute; inset: 0; z-index: 1; }

        /* UI 覆盖层 */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

        /* 左下角：摄像头窗口 (可拖拽调整大小) */
        .cam-box {
            position: absolute; bottom: 20px; left: 20px;
            width: 200px; height: 150px; min-width: 120px; min-height: 90px;
            background: #000; border: 1px solid #333; border-radius: 8px;
            overflow: hidden; resize: both; pointer-events: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
        }
        .cam-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.8; }
        .cam-status { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .cam-status.active { background: #0f0; box-shadow: 0 0 8px #0f0; }
        .cam-msg { position: absolute; color: #666; font-size: 12px; text-align: center; width: 100%; }

        /* 右侧：控制面板 */
        .controls {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            width: 180px; padding: 15px;
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            pointer-events: auto; display: flex; flex-direction: column; gap: 12px;
        }
        .control-group { margin-bottom: 5px; }
        .label { color: #aaa; font-size: 11px; margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        
        /* 按钮样式 */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #ddd; padding: 8px 0; font-size: 12px; border-radius: 4px;
            cursor: pointer; transition: 0.2s;
        }
        button:hover, button.active { background: var(--highlight); color: #000; border-color: var(--highlight); font-weight: bold; }

        /* 输入控件 */
        input[type="range"] { width: 100%; accent-color: var(--highlight); height: 4px; cursor: pointer; }
        input[type="color"] { width: 100%; height: 25px; border: none; background: none; cursor: pointer; padding: 0; }

        /* 右下角：全屏按钮 */
        #fs-btn {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            pointer-events: auto; display: grid; place-items: center; font-size: 18px;
            transition: 0.3s;
        }
        #fs-btn:hover { background: #fff; color: #000; }

        /* 加载指示器 (极速消失) */
        #loader {
            position: absolute; inset: 0; background: #000; z-index: 99;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s; pointer-events: none;
        }
        .spinner { width: 30px; height: 30px; border: 2px solid #333; border-top-color: var(--highlight); border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Import Map 解决依赖 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <!-- MediaPipe (异步加载，不会阻塞页面) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top:10px; color:#666; font-size:12px;">SYSTEM BOOT...</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <!-- 摄像头 -->
        <div class="cam-box">
            <div class="cam-msg" id="cam-msg">Waiting for AI...</div>
            <video class="cam-video" playsinline muted></video>
            <div class="cam-status" id="cam-status"></div>
        </div>

        <!-- 全屏 -->
        <button id="fs-btn" onclick="toggleFull()">⛶</button>

        <!-- 控制台 -->
        <div class="controls">
            <div class="control-group">
                <span class="label">Shapes</span>
                <div class="btn-grid">
                    <button class="active" onclick="setShape('nebula')" id="btn-nebula">Nebula</button>
                    <button onclick="setShape('saturn')" id="btn-saturn">Saturn</button>
                    <button onclick="setShape('flower')" id="btn-flower">Flower</button>
                    <button onclick="setShape('firework')" id="btn-firework">Firework</button>
                </div>
            </div>
            
            <div class="control-group">
                <span class="label">Color Base</span>
                <input type="color" value="#00ffff" oninput="updateColor(this.value)">
            </div>

            <div class="control-group">
                <span class="label">Density</span>
                <input type="range" min="10000" max="80000" step="5000" value="40000" onchange="updateDensity(this.value)">
            </div>
            
            <div style="font-size:10px; color:#555; margin-top:10px; line-height:1.4;">
                Interactive Mode:<br>
                • Pinch to Scale<br>
                • Move Hand to Rotate
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ================= 全局状态 =================
        const config = {
            count: 40000,
            baseColor: new THREE.Color('#00ffff'),
            shape: 'nebula',
            autoRotate: true
        };

        const state = {
            spread: 1.0,      // 粒子扩散系数
            rotation: 0,      // 粒子旋转角度
            targetSpread: 1.0,
            targetRotation: 0,
            isHandActive: false // 是否检测到手势
        };

        let scene, camera, renderer, particles, geometry, material, controls;
        let positionsOriginal = []; // 原始形状数据
        let currentPositions = [];  // 当前动画数据
        
        // ================= 1. 3D 引擎 (瞬间启动) =================
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02); // 黑色迷雾，增加纵深

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enableZoom = true;

            // 创建深空背景粒子
            createBackgroundStars();

            // 创建主交互粒子系统
            createParticleSystem();

            // 监听窗口大小
            window.addEventListener('resize', onWindowResize);

            // 移除 Loading
            document.getElementById('loader').style.opacity = 0;
            setTimeout(() => document.getElementById('loader').remove(), 500);

            // 启动渲染循环
            animate();

            // 异步加载 AI
            initAI();
        }

        // ================= 2. 粒子核心逻辑 =================
        
        // 动态生成辉光纹理 (无需图片，极速)
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,255,255,0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,32,32);
            const tex = new THREE.Texture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        function createBackgroundStars() {
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            const starCount = 3000;
            for(let i=0; i<starCount; i++) {
                starPos.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({
                color: 0x666666, size: 0.3, transparent: true, opacity: 0.6
            });
            scene.add(new THREE.Points(starGeo, starMat));
        }

        function createParticleSystem() {
            if(particles) scene.remove(particles);

            geometry = new THREE.BufferGeometry();
            positionsOriginal = new Float32Array(config.count * 3);
            currentPositions = new Float32Array(config.count * 3);
            const colors = new Float32Array(config.count * 3);

            // 初始随机位置
            for(let i=0; i<config.count*3; i++) {
                currentPositions[i] = (Math.random()-0.5) * 50;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({
                size: 0.15,
                map: createGlowTexture(),
                vertexColors: true,
                blending: THREE.AdditiveBlending, // 加法混合，发光关键
                depthWrite: false,
                transparent: true,
                opacity: 0.9
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            updateShape(config.shape);
        }

        // 数学公式生成模型
        function updateShape(type) {
            const count = config.count;
            for(let i=0; i<count; i++) {
                const i3 = i*3;
                let x, y, z;
                
                if (type === 'nebula') {
                    const r = Math.random() * 15;
                    const angle = i * 0.02 + r; // 螺旋
                    x = Math.cos(angle) * r;
                    z = Math.sin(angle) * r;
                    y = (Math.random()-0.5) * (15 - r) * 0.5; // 中心厚，边缘薄
                } 
                else if (type === 'saturn') {
                    if (Math.random() > 0.3) { // 环
                        const angle = Math.random() * Math.PI * 2;
                        const r = 8 + Math.random() * 6;
                        x = Math.cos(angle) * r;
                        z = Math.sin(angle) * r;
                        y = (Math.random()-0.5) * 0.2;
                    } else { // 本体
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const r = 5;
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }
                    // 倾斜
                    const ty = y; 
                    y = ty * Math.cos(0.4) - z * Math.sin(0.4);
                    z = ty * Math.sin(0.4) + z * Math.cos(0.4);
                } 
                else if (type === 'flower') {
                    // 玫瑰线球
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const r = 10 * Math.sin(3 * u) * Math.sin(v);
                    x = r * Math.sin(u) * Math.cos(v);
                    y = r * Math.cos(u);
                    z = r * Math.sin(u) * Math.sin(v);
                }
                else { // firework
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = Math.pow(Math.random(), 1/3) * 15; // 均匀分布球体
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }

                positionsOriginal[i3] = x;
                positionsOriginal[i3+1] = y;
                positionsOriginal[i3+2] = z;
            }
        }

        // ================= 3. 动画循环 =================
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.0005;
            const posAttr = geometry.attributes.position;
            const colAttr = geometry.attributes.color;
            const positions = posAttr.array;
            const colors = colAttr.array;

            // 1. 平滑处理交互数据
            state.spread += (state.targetSpread - state.spread) * 0.1;
            state.rotation += (state.targetRotation - state.rotation) * 0.05;

            // 2. 整体旋转
            const autoRot = config.autoRotate && !state.isHandActive ? time * 0.5 : 0;
            particles.rotation.y = state.rotation + autoRot;

            // 3. 计算颜色与位置
            const baseHSL = {};
            config.baseColor.getHSL(baseHSL);

            for(let i=0; i<config.count; i++) {
                const i3 = i*3;

                // 位置插值: Lerp towards original * spread
                const tx = positionsOriginal[i3] * state.spread;
                const ty = positionsOriginal[i3+1] * state.spread;
                const tz = positionsOriginal[i3+2] * state.spread;

                currentPositions[i3] += (tx - currentPositions[i3]) * 0.1;
                currentPositions[i3+1] += (ty - currentPositions[i3+1]) * 0.1;
                currentPositions[i3+2] += (tz - currentPositions[i3+2]) * 0.1;

                // 增加呼吸感噪点
                const noise = Math.sin(time * 5 + i) * 0.05;
                positions[i3] = currentPositions[i3] + noise;
                positions[i3+1] = currentPositions[i3+1] + noise;
                positions[i3+2] = currentPositions[i3+2] + noise;

                // 动态颜色: 基于旋转角度 + 粒子高度 + 基础色
                // 实现“五彩斑斓”但有主色调的效果
                const hueShift = (particles.rotation.y * 0.1 + positions[i3+1] * 0.05) % 1.0;
                const h = (baseHSL.h + hueShift + 1.0) % 1.0; 
                
                const color = new THREE.Color().setHSL(h, 0.8, 0.6);
                colors[i3] = color.r;
                colors[i3+1] = color.g;
                colors[i3+2] = color.b;
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // ================= 4. AI 模块 (完全独立，失败不影响3D) =================
        async function initAI() {
            const videoEl = document.querySelector('.cam-video');
            const msgEl = document.getElementById('cam-msg');
            const statusEl = document.getElementById('cam-status');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                msgEl.innerText = "Camera Denied";
                return;
            }

            try {
                // 动态加载 MediaPipe
                const hands = new Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0, // 0 = Lite模型 (极速)
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(results => {
                    if (results.multiHandLandmarks.length > 0) {
                        state.isHandActive = true;
                        statusEl.classList.add('active');
                        msgEl.innerText = "";
                        
                        const lm = results.multiHandLandmarks[0];

                        // 1. 旋转 (手掌中心 X)
                        // 0 (左) -> -2 rad, 1 (右) -> +2 rad
                        const handX = lm[9].x; 
                        state.targetRotation = (handX - 0.5) * 4;

                        // 2. 缩放 (拇指-食指距离)
                        const dist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                        // 映射: 0.02->0.2(聚拢), 0.2->2.5(扩散)
                        let s = (dist - 0.02) * 12;
                        s = Math.max(0.2, Math.min(3.0, s));
                        state.targetSpread = s;

                    } else {
                        state.isHandActive = false;
                        statusEl.classList.remove('active');
                        state.targetSpread = 1.0; // 自动复位
                    }
                });

                const camera = new Camera(videoEl, {
                    onFrame: async () => await hands.send({image: videoEl}),
                    width: 320, height: 240
                });

                await camera.start();
                msgEl.innerText = ""; // 清除等待文字

            } catch (err) {
                console.warn(err);
                msgEl.innerText = "AI Load Failed";
                // 失败不影响主程序运行
            }
        }

        // ================= UI 交互函数 =================
        window.setShape = (type) => {
            config.shape = type;
            updateShape(type);
            document.querySelectorAll('.btn-grid button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
        };

        window.updateColor = (val) => {
            config.baseColor.set(val);
        };

        window.updateDensity = (val) => {
            config.count = parseInt(val);
            createParticleSystem();
        };

        window.toggleFull = () => {
            if(!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 启动
        initThree();

    </script>
</body>
</html>
