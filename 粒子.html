<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 粒子系统 (调试增强版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI 层 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        /* 摄像头小窗 */
        .camera-box {
            position: absolute; bottom: 20px; left: 20px;
            pointer-events: auto; background: rgba(0,0,0,0.5);
            padding: 5px; border-radius: 8px; border: 1px solid #444;
        }
        .input_video {
            width: 160px; height: 120px; transform: scaleX(-1);
            background: #111; display: block;
        }
        #cam-status {
            color: #0f0; font-size: 12px; margin-bottom: 5px; text-align: center;
        }

        /* 加载与调试遮罩 */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 100;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #ccc;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #00ffff;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 屏幕日志输出 - 关键调试工具 */
        #debug-console {
            width: 80%; max-width: 600px; height: 150px;
            background: #000; border: 1px solid #333;
            overflow-y: auto; padding: 10px; font-size: 12px;
            color: #0f0; text-align: left; margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        #force-start-btn {
            margin-top: 20px; padding: 10px 20px;
            background: #333; color: white; border: 1px solid #555;
            cursor: pointer; display: none;
        }
        #force-start-btn:hover { background: #555; }

        .lil-gui { position: absolute; top: 10px; right: 10px; pointer-events: auto; }
    </style>

    <!-- Import Map: 统一管理版本，防止冲突 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
    
    <!-- MediaPipe 库 (传统加载) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2>系统初始化中...</h2>
        <div id="debug-console">日志系统启动...<br></div>
        <button id="force-start-btn" onclick="forceStart()">强制进入 (跳过错误)</button>
    </div>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="camera-box">
            <div id="cam-status">等待摄像头...</div>
            <video class="input_video" playsinline></video>
        </div>
    </div>

    <script>
        // 全局日志函数，把错误显示在屏幕上
        const consoleDiv = document.getElementById('debug-console');
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : (type === 'warn' ? 'yellow' : '#0f0');
            consoleDiv.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        window.onerror = function(message, source, lineno, colno, error) {
            log(`全局错误: ${message}`, 'error');
            document.getElementById('force-start-btn').style.display = 'block';
        };

        // 超时保护：如果 5秒 还没进系统，显示强制按钮
        setTimeout(() => {
            if(document.getElementById('loader').style.display !== 'none') {
                log('加载时间过长，请检查网络或点击强制进入', 'warn');
                document.getElementById('force-start-btn').style.display = 'block';
            }
        }, 5000);

        function forceStart() {
            document.getElementById('loader').style.display = 'none';
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        log("Three.js 模块加载成功");

        // ================= 配置 =================
        const config = {
            count: 20000,
            size: 0.2,
            color: '#00ffff',
            shape: 'Heart',
            autoRotate: true
        };

        let scene, camera, renderer, particles, geometry, material, controls;
        let originalPos = [], currentPos = [];
        let handScale = 1.0, targetHandScale = 1.0;
        let isCameraActive = false;

        // ================= 3D 引擎初始化 =================
        try {
            initThree();
            log("3D 场景初始化完成");
            // 3D 成功后，直接移除遮罩，不等待摄像头
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                // 延迟加载摄像头
                initCamera(); 
            }, 500);
        } catch (e) {
            log(`3D 初始化崩溃: ${e.message}`, 'error');
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            createParticles();
            initGUI();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function getTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,32,32);
            return new THREE.Texture(canvas);
        }

        function createParticles() {
            if(particles) scene.remove(particles);
            
            geometry = new THREE.BufferGeometry();
            const pos = new Float32Array(config.count * 3);
            originalPos = new Float32Array(config.count * 3);
            currentPos = new Float32Array(config.count * 3);

            for(let i=0; i<config.count*3; i++) {
                currentPos[i] = (Math.random()-0.5)*50;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));

            const tex = getTexture();
            tex.needsUpdate = true;

            material = new THREE.PointsMaterial({
                size: config.size,
                color: config.color,
                map: tex,
                transparent: true,
                opacity: 0.8,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            updateShape(config.shape);
        }

        function updateShape(type) {
            log(`切换模型: ${type}`);
            const count = config.count;
            for(let i=0; i<count; i++) {
                let x,y,z;
                const idx = i*3;
                const r1 = Math.random();
                const r2 = Math.random();
                
                if(type === 'Heart') {
                    const t = r1 * Math.PI * 2;
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    z = (r2-0.5) * 5;
                    const s = Math.cbrt(Math.random()) * 0.5;
                    x*=s; y*=s; z*=s;
                } else if(type === 'Flower') {
                    const theta = r1 * Math.PI * 2;
                    const phi = Math.acos(2*r2-1);
                    const r = 10 * (1 + 0.5 * Math.sin(5*theta) * Math.sin(phi));
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } else if(type === 'Saturn') {
                    // 土星简单模拟
                    if(r1 > 0.4) { // 环
                        const ang = r1 * Math.PI * 20;
                        const dist = 10 + r2 * 8;
                        x = Math.cos(ang)*dist; z=Math.sin(ang)*dist; y=(Math.random()-0.5);
                    } else { // 球
                        const theta = r1 * Math.PI * 2;
                        const phi = Math.acos(2*r2-1);
                        const r = 6;
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }
                    const tx=x; x = x*0.8 - y*0.6; y = tx*0.6 + y*0.8; // 倾斜
                } else { // Fireworks
                    const theta = r1 * Math.PI * 2;
                    const phi = Math.acos(2*r2-1);
                    const r = Math.pow(Math.random(), 0.5) * 20;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }

                originalPos[idx] = x;
                originalPos[idx+1] = y;
                originalPos[idx+2] = z;
            }
        }

        function initGUI() {
            const gui = new GUI({ title: '控制台' });
            gui.add(config, 'shape', ['Heart', 'Flower', 'Saturn', 'Fireworks']).onChange(updateShape);
            gui.addColor(config, 'color').onChange(c => material.color.set(c));
            gui.add(config, 'size', 0.1, 1.0).onChange(s => material.size = s);
            gui.add(config, 'autoRotate');
        }

        function animate() {
            requestAnimationFrame(animate);
            
            handScale += (targetHandScale - handScale) * 0.1;

            const pos = geometry.attributes.position.array;
            for(let i=0; i<config.count; i++) {
                const idx = i*3;
                const tx = originalPos[idx] * handScale;
                const ty = originalPos[idx+1] * handScale;
                const tz = originalPos[idx+2] * handScale;

                pos[idx] += (tx - pos[idx]) * 0.08;
                pos[idx+1] += (ty - pos[idx+1]) * 0.08;
                pos[idx+2] += (tz - pos[idx+2]) * 0.08;
                
                if(isCameraActive) {
                    const n = 0.05 * handScale;
                    pos[idx] += (Math.random()-0.5)*n;
                    pos[idx+1] += (Math.random()-0.5)*n;
                    pos[idx+2] += (Math.random()-0.5)*n;
                }
            }
            geometry.attributes.position.needsUpdate = true;

            if(config.autoRotate) particles.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }

        // ================= MediaPipe 独立加载 =================
        async function initCamera() {
            const videoEl = document.querySelector('.input_video');
            const statusEl = document.getElementById('cam-status');
            
            if(!window.Hands || !window.Camera) {
                log("MediaPipe 脚本未加载，可能是网络问题被墙了", "error");
                statusEl.innerText = "脚本加载失败";
                return;
            }

            log("开始加载 MediaPipe 模型...");
            statusEl.innerText = "加载模型中...";

            try {
                const hands = new Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0, // 降级以提高速度
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(results => {
                    if(!isCameraActive) {
                        isCameraActive = true;
                        statusEl.innerText = "● 交互中";
                        statusEl.style.color = "#0f0";
                        log("手势识别已激活");
                    }
                    
                    if (results.multiHandLandmarks.length > 0) {
                        const lm = results.multiHandLandmarks[0];
                        // 拇指4，食指8
                        const d = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                        // 映射
                        const n = Math.max(0, Math.min(1, (d - 0.02) / 0.15));
                        targetHandScale = 0.5 + n * 2.0;
                    } else {
                        targetHandScale = 1.0;
                    }
                });

                const camera = new Camera(videoEl, {
                    onFrame: async () => {
                        await hands.send({image: videoEl});
                    },
                    width: 320, height: 240
                });

                await camera.start();
                log("摄像头已启动");

            } catch(e) {
                log(`摄像头错误: ${e.message}`, 'error');
                statusEl.innerText = "摄像头失败";
            }
        }
    </script>
</body>
</html>
