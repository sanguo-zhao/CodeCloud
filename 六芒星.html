<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXXTENTACION: Ethereal Energy</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-family: 'Courier New', monospace; letter-spacing: 2px;
            font-size: 14px; pointer-events: none; text-transform: uppercase;
        }
    </style>
    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Generating Energy Field...</div>
    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 配置
        const config = {
            particleCount: 60000, // 高密度
            particleSize: 2.5,
            glowColor: new THREE.Color('#6a0dad'), // 紫色
            accentColor: new THREE.Color('#00bfff'), // 蓝色
        };

        let scene, camera, renderer, material, mesh;
        let time = 0;
        const mouse = new THREE.Vector2();
        
        // 自定义着色器：实现电流流动和光影效果
        const vertexShader = `
            uniform float time;
            uniform vec2 mouse;
            attribute float size;
            attribute vec3 customColor;
            attribute float intensity; // 亮度/深度
            
            varying vec3 vColor;
            varying float vAlpha;

            // 伪随机
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            // 噪声函数
            float noise(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                return mix(mix(mix(random(i.xy + vec2(0.0, 0.0)), random(i.xy + vec2(1.0, 0.0)), f.x),
                               mix(random(i.xy + vec2(0.0, 1.0)), random(i.xy + vec2(1.0, 1.0)), f.x), f.y),
                           mix(mix(random(i.xy + vec2(0.0, 0.0)), random(i.xy + vec2(1.0, 0.0)), f.x),
                               mix(random(i.xy + vec2(0.0, 1.0)), random(i.xy + vec2(1.0, 1.0)), f.x), f.y), f.z);
            }

            void main() {
                vColor = customColor;
                
                vec3 pos = position;

                // 1. 交互干扰 (磁场效果)
                float dist = distance(mouse * 30.0, pos.xy);
                float influence = smoothstep(8.0, 0.0, dist);
                
                // 鼠标靠近时，粒子向Z轴炸裂，产生破碎感
                pos.z += influence * 5.0 * sin(time * 10.0 + pos.x);
                pos.x += influence * 2.0 * cos(time * 5.0 + pos.y);

                // 2. 基础电流流动 (微小的噪点震动)
                float electric = sin(pos.y * 10.0 + time * 5.0) * 0.05;
                pos.x += electric;

                // 3. 深度立体感增强
                // 越亮的地方(intensity高)越突出
                pos.z += intensity * 3.0;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;

                // 大小随深度衰减
                gl_PointSize = size * (300.0 / -mvPosition.z);
                
                // 边缘透明度
                vAlpha = 0.6 + intensity * 0.4; 
            }
        `;

        const fragmentShader = `
            uniform vec3 color;
            uniform sampler2D pointTexture;
            
            varying vec3 vColor;
            varying float vAlpha;

            void main() {
                // 圆形粒子绘制
                vec2 coord = gl_PointCoord - vec2(0.5);
                float dist = length(coord);
                if (dist > 0.5) discard;

                // 辉光核心
                float glow = 1.0 - (dist * 2.0);
                glow = pow(glow, 1.5);

                gl_FragColor = vec4(vColor * glow + vec3(0.1), vAlpha * glow);
            }
        `;

        function init() {
            const container = document.getElementById('container');

            // 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            // 相机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 60;
            camera.position.y = 0;

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000);
            container.appendChild(renderer.domElement);

            // 控制器
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = false;
            controls.maxDistance = 100;
            controls.minDistance = 20;

            // 生成人像数据
            generatePortrait();

            // 背景星尘
            createBackground();

            // 事件
            window.addEventListener('resize', onResize);
            document.addEventListener('mousemove', onMouseMove);

            // 移除 Loading
            document.getElementById('loading').style.display = 'none';

            animate();
        }

        // --- 核心：程序化生成 XXXTENTACION 的剪影数据 ---
        function generatePortrait() {
            // 1. 创建虚拟画布
            const width = 256;
            const height = 300;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // 填充黑色背景
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2 + 20;

            // --- 绘制脸部轮廓 ---
            ctx.fillStyle = '#444'; // 基础灰色
            ctx.beginPath();
            // 尖下巴，宽额头
            ctx.ellipse(cx, cy, 55, 75, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- 绘制五官阴影 (模拟深度) ---
            ctx.fillStyle = '#fff'; // 亮部（鼻子、脸颊）
            // 鼻梁
            ctx.beginPath();
            ctx.ellipse(cx, cy + 5, 8, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            // 颧骨高光
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.ellipse(cx - 30, cy, 10, 15, -0.2, 0, Math.PI * 2);
            ctx.ellipse(cx + 30, cy, 10, 15, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // 眼窝 (深色)
            ctx.fillStyle = '#000'; 
            ctx.beginPath();
            ctx.ellipse(cx - 20, cy - 10, 10, 6, 0.2, 0, Math.PI * 2); // 左眼
            ctx.ellipse(cx + 20, cy - 10, 10, 6, -0.2, 0, Math.PI * 2); // 右眼
            ctx.fill();

            // 眼神光 (更有神)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx - 20, cy - 10, 2, 0, Math.PI*2);
            ctx.arc(cx + 20, cy - 10, 2, 0, Math.PI*2);
            ctx.fill();

            // --- 绘制标志性脏辫 (Dreadlocks) ---
            // 这部分是个性特征的关键
            ctx.strokeStyle = '#888'; // 头发颜色
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            
            // 使用放射状线条模拟他早期的发型
            const dreadCount = 12;
            for(let i = 0; i < dreadCount; i++) {
                const angle = -Math.PI + (i / (dreadCount-1)) * Math.PI; // 从左到右
                // 左边黑发，右边金发 (他最经典的造型之一是半黑半金)
                if (i > dreadCount / 2) ctx.strokeStyle = '#ccc'; // 金发(亮色)
                else ctx.strokeStyle = '#333'; // 黑发(暗色)

                const len = 50 + Math.random() * 20;
                
                // 控制发型走向：向上散开
                const sx = cx + Math.cos(angle) * 40;
                const sy = cy - 40 + Math.sin(angle) * 20;
                const ex = sx + Math.cos(angle - Math.PI/2 * 0.5) * len * (i < dreadCount/2 ? -0.5 : 0.5); 
                const ey = sy - len;

                // 贝塞尔曲线画卷曲感
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.quadraticCurveTo(sx + (Math.random()-0.5)*20, sy - len/2, ex, ey);
                ctx.stroke();
            }

            // --- 2. 采样像素生成 3D 粒子 ---
            const imgData = ctx.getImageData(0, 0, width, height).data;
            const positions = [];
            const colors = [];
            const intensities = [];
            const sizes = [];

            // 粒子化
            for (let y = 0; y < height; y += 2) {
                for (let x = 0; x < width; x += 2) {
                    const idx = (y * width + x) * 4;
                    const r = imgData[idx];
                    const g = imgData[idx + 1];
                    const b = imgData[idx + 2];
                    const brightness = (r + g + b) / 3;

                    // 只在有内容的地方生成粒子
                    if (brightness > 10 || (x > 80 && x < 176 && y > 100 && y < 250)) { // 保持脸部轮廓即使很暗
                        
                        // 坐标映射：居中
                        const px = (x - width / 2) * 0.15;
                        const py = -(y - height / 2) * 0.15;
                        const pz = 0;

                        positions.push(px, py, pz);

                        // 颜色混合
                        // 亮部是白色，暗部混合紫色/蓝色
                        const intensity = brightness / 255;
                        intensities.push(intensity);

                        const color = new THREE.Color();
                        if (intensity > 0.8) {
                            color.setHex(0xffffff); // 高光
                        } else if (intensity > 0.4) {
                            color.lerpColors(config.glowColor, new THREE.Color(0xffffff), intensity);
                        } else {
                            // 边缘轮廓使用蓝色/深紫
                            color.lerpColors(new THREE.Color(0x000000), config.accentColor, 0.5);
                        }

                        colors.push(color.r, color.g, color.b);
                        
                        // 随机大小，形成噪点风格
                        sizes.push(config.particleSize * (0.5 + Math.random()));
                    }
                }
            }

            // 创建 BufferGeometry
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('intensity', new THREE.Float32BufferAttribute(intensities, 1));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Shader Material
            material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    mouse: { value: new THREE.Vector2(0, 0) }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });

            mesh = new THREE.Points(geometry, material);
            scene.add(mesh);
        }

        // --- 背景环境 ---
        function createBackground() {
            const count = 2000;
            const pos = [];
            const cols = [];
            for(let i=0; i<count; i++) {
                pos.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*100 - 50);
                const c = new THREE.Color().setHSL(Math.random(), 0.6, 0.1); // 暗淡的彩色
                cols.push(c.r, c.g, c.b);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
            const mat = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent:true, opacity:0.5 });
            scene.add(new THREE.Points(geo, mat));
        }

        function onMouseMove(event) {
            // 归一化鼠标坐标 (-1 to 1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            if (material) {
                material.uniforms.time.value = time;
                // 缓动鼠标值
                material.uniforms.mouse.value.lerp(mouse, 0.1);
            }

            // 细微的呼吸旋转
            if (mesh) {
                mesh.rotation.y = Math.sin(time * 0.2) * 0.1;
                mesh.rotation.z = Math.cos(time * 0.15) * 0.05;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
